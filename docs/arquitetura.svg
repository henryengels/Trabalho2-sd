<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 860" width="1500" height="860" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Arquitetura de microsserviços da Fintech SD</title>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .titulo { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .tec { font-size: 13px; font-weight: 600; }
      .item { font-size: 12.5px; fill: #334155; }
      .rotulo { font-size: 12px; font-weight: 600; fill: #1e293b; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .limite { font-size: 14px; font-weight: 700; }
      .linha { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#seta); }
    </style>
  </defs>

  <rect width="1500" height="860" fill="#ffffff"/>

  <!-- Google Cloud -->
  <rect x="250" y="20" width="1230" height="820" rx="18" fill="#f1f6fe" stroke="#4285f4" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="272" y="50" class="limite" fill="#1a56c4">Google Cloud (projeto do trabalho)</text>

  <!-- VM -->
  <rect x="280" y="66" width="900" height="756" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="300" y="94" class="limite" fill="#475569">VM Compute Engine · Docker Compose</text>
  <text x="300" y="114" class="item">Firewall: só 80 e 443 abertos. Gateway, gRPC e banco ficam na rede interna.</text>

  <!-- Navegador -->
  <rect x="30" y="350" width="190" height="140" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="125" y="382" text-anchor="middle" class="titulo">Navegador</text>
  <text x="125" y="406" text-anchor="middle" class="tec" fill="#475569">Frontend</text>
  <text x="125" y="428" text-anchor="middle" class="item">HTML · CSS · JavaScript</text>
  <text x="125" y="448" text-anchor="middle" class="item">token JWT na sessão</text>
  <text x="125" y="468" text-anchor="middle" class="item">fala só com /api</text>

  <!-- nginx -->
  <rect x="310" y="330" width="185" height="180" rx="12" fill="#ecfdf3" stroke="#009639" stroke-width="2.5"/>
  <text x="402" y="362" text-anchor="middle" class="titulo">nginx</text>
  <text x="402" y="384" text-anchor="middle" class="tec" fill="#047857">HTTPS :443 · TLS 1.2/1.3</text>
  <text x="402" y="408" text-anchor="middle" class="item">HTTP :80 → 301 HTTPS</text>
  <text x="402" y="428" text-anchor="middle" class="item">HSTS · CSP · X-Frame</text>
  <text x="402" y="448" text-anchor="middle" class="item">rate limit no login</text>
  <text x="402" y="468" text-anchor="middle" class="item">serve o frontend</text>
  <text x="402" y="488" text-anchor="middle" class="item">proxy de /api</text>

  <!-- API Gateway -->
  <rect x="545" y="310" width="215" height="220" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/>
  <text x="652" y="342" text-anchor="middle" class="titulo">API Gateway</text>
  <text x="652" y="364" text-anchor="middle" class="tec" fill="#0f766e">Python · FastAPI · :8000</text>
  <text x="652" y="390" text-anchor="middle" class="item">middleware JWT → 401</text>
  <text x="652" y="410" text-anchor="middle" class="item">Pydantic → 400</text>
  <text x="652" y="430" text-anchor="middle" class="item">CORS restrito</text>
  <text x="652" y="450" text-anchor="middle" class="item">JSON → Protobuf binário</text>
  <text x="652" y="470" text-anchor="middle" class="item">orquestra os serviços</text>
  <text x="652" y="490" text-anchor="middle" class="item">gRPC → HTTP (409, 422, 503)</text>
  <text x="652" y="510" text-anchor="middle" class="item">segredos via .env</text>

  <!-- conta-service (Java) -->
  <rect x="820" y="140" width="195" height="180" rx="12" fill="#fff7ed" stroke="#e76f00" stroke-width="2.5"/>
  <text x="917" y="172" text-anchor="middle" class="titulo">conta-service</text>
  <text x="917" y="194" text-anchor="middle" class="tec" fill="#c2410c">Java 21 · gRPC :9091</text>
  <text x="917" y="218" text-anchor="middle" class="item">CriarConta · Autenticar</text>
  <text x="917" y="238" text-anchor="middle" class="item">ConsultarSaldo</text>
  <text x="917" y="258" text-anchor="middle" class="item">Transferir · Depositar</text>
  <text x="917" y="278" text-anchor="middle" class="item">BCrypt · SELECT FOR UPDATE</text>
  <text x="917" y="298" text-anchor="middle" class="item">JDBC + HikariCP</text>

  <!-- pagamento-service (Python) -->
  <rect x="820" y="540" width="195" height="180" rx="12" fill="#eff6ff" stroke="#3776ab" stroke-width="2.5"/>
  <text x="917" y="572" text-anchor="middle" class="titulo">pagamento-service</text>
  <text x="917" y="594" text-anchor="middle" class="tec" fill="#1d4ed8">Python 3.12 · gRPC :9090</text>
  <text x="917" y="618" text-anchor="middle" class="item">ProcessarTransacao</text>
  <text x="917" y="638" text-anchor="middle" class="item">RealizarDeposito</text>
  <text x="917" y="658" text-anchor="middle" class="item">Listar/ConsultarTransacao</text>
  <text x="917" y="678" text-anchor="middle" class="item">status PENDENTE → final</text>
  <text x="917" y="698" text-anchor="middle" class="item">psycopg 3 + pool</text>

  <!-- Cloud SQL Auth Proxy -->
  <rect x="1045" y="365" width="120" height="110" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="1105" y="396" text-anchor="middle" class="tec" fill="#0f172a">Cloud SQL</text>
  <text x="1105" y="414" text-anchor="middle" class="tec" fill="#0f172a">Auth Proxy</text>
  <text x="1105" y="436" text-anchor="middle" class="item">:5432</text>
  <text x="1105" y="456" text-anchor="middle" class="item">nome "banco"</text>

  <!-- Cloud SQL -->
  <rect x="1225" y="320" width="235" height="205" rx="12" fill="#eef4fb" stroke="#336791" stroke-width="2.5"/>
  <text x="1342" y="352" text-anchor="middle" class="titulo">Cloud SQL</text>
  <text x="1342" y="374" text-anchor="middle" class="tec" fill="#336791">PostgreSQL 18 (gerenciado)</text>
  <text x="1342" y="402" text-anchor="middle" class="tec" fill="#c2410c">fintech_contas</text>
  <text x="1342" y="420" text-anchor="middle" class="item">usuário conta_app</text>
  <text x="1342" y="438" text-anchor="middle" class="item">└ conta.contas (saldo ≥ 0)</text>
  <text x="1342" y="466" text-anchor="middle" class="tec" fill="#1d4ed8">fintech_pagamentos</text>
  <text x="1342" y="484" text-anchor="middle" class="item">usuário pagamento_app</text>
  <text x="1342" y="502" text-anchor="middle" class="item">└ pagamento.transacoes</text>

  <!-- Fluxos -->
  <path class="linha" d="M220,420 H306"/>
  <text x="263" y="408" text-anchor="middle" class="rotulo">HTTPS</text>
  <text x="263" y="442" text-anchor="middle" class="rotulo">JSON</text>

  <path class="linha" d="M495,420 H541"/>
  <text x="518" y="408" text-anchor="middle" class="rotulo">/api</text>

  <path class="linha" d="M760,370 H790 V230 H816"/>
  <text transform="translate(783,300) rotate(-90)" text-anchor="middle" class="rotulo">gRPC · Protobuf</text>

  <path class="linha" d="M760,470 H790 V630 H816"/>
  <text transform="translate(783,550) rotate(-90)" text-anchor="middle" class="rotulo">gRPC · Protobuf</text>

  <path class="linha" d="M917,540 V324"/>
  <text transform="translate(909,432) rotate(-90)" text-anchor="middle" class="rotulo">gRPC: Transferir · Depositar</text>

  <path class="linha" d="M1015,230 H1105 V361"/>
  <text x="1060" y="220" text-anchor="middle" class="rotulo">JDBC</text>

  <path class="linha" d="M1015,630 H1105 V479"/>
  <text x="1060" y="650" text-anchor="middle" class="rotulo">psycopg</text>

  <path class="linha" d="M1165,420 H1221"/>
  <text x="1194" y="408" text-anchor="middle" class="rotulo">TLS</text>
  <text x="1194" y="442" text-anchor="middle" class="rotulo">IAM</text>

  <!-- Contratos -->
  <rect x="545" y="740" width="470" height="64" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="780" y="766" text-anchor="middle" class="tec" fill="#0f172a">Contratos: proto/conta.proto · proto/pagamento.proto</text>
  <text x="780" y="788" text-anchor="middle" class="item">stubs Java (Maven) e Python (grpcio-tools) gerados dos mesmos arquivos</text>

  <!-- Legenda -->
  <g transform="translate(30,700)">
    <text x="0" y="0" class="tec" fill="#0f172a">Linguagens</text>
    <rect x="0" y="14" width="16" height="16" rx="4" fill="#fff7ed" stroke="#e76f00" stroke-width="2"/>
    <text x="24" y="27" class="item">Java</text>
    <rect x="0" y="40" width="16" height="16" rx="4" fill="#eff6ff" stroke="#3776ab" stroke-width="2"/>
    <text x="24" y="53" class="item">Python</text>
    <rect x="0" y="66" width="16" height="16" rx="4" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <text x="24" y="79" class="item">Python (gateway)</text>
  </g>
</svg>
