# Proxy reverso na borda do sistema. É o único contêiner com portas publicadas:
# termina o HTTPS, serve o frontend estático e encaminha /api/ ao API Gateway.
# (Incluído pelo nginx dentro do bloco http, como /etc/nginx/conf.d/default.conf.)

# Limite de requisições por IP nas rotas de login e cadastro (contra força bruta).
limit_req_zone $binary_remote_addr zone=autenticacao:10m rate=30r/m;
# Limite geral para o restante da API.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

upstream api_gateway {
    server api-gateway:8000;
}

# HTTP apenas redireciona para HTTPS.
server {
    listen 80;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    # Certificado gerado por 10-gerar-certificado.sh na inicialização do contêiner
    # (ou montado em /etc/nginx/certs, se houver um emitido por uma autoridade certificadora).
    ssl_certificate     /etc/nginx/certs/fintech.crt;
    ssl_certificate_key /etc/nginx/certs/fintech.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Os JSON da API têm poucos bytes; corpos maiores são recusados com 413.
    client_max_body_size 16k;

    # Os cabeçalhos de segurança são incluídos em cada location porque, no nginx, uma
    # location com add_header próprio não herda os add_header do bloco server.

    # Frontend estático. A CSP só permite scripts, estilos e chamadas da própria origem.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/cabecalhos-seguranca.conf;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control "no-cache" always;
    }

    # Login e cadastro, com limite mais rígido.
    location /api/auth/ {
        limit_req zone=autenticacao burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy-gateway.conf;
    }

    # Swagger UI do gateway: carrega scripts do jsDelivr, então a CSP é mais permissiva aqui.
    location /api/docs {
        include /etc/nginx/snippets/proxy-gateway.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; frame-ancestors 'none'" always;
    }

    # Demais rotas da API.
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy-gateway.conf;
    }
}
