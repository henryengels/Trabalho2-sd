# Cabeçalhos de segurança enviados em todas as respostas HTTPS.
# HSTS: o navegador passa a usar somente HTTPS para este host.
add_header Strict-Transport-Security "max-age=31536000" always;
# Impede que o navegador "adivinhe" o tipo do conteúdo.
add_header X-Content-Type-Options "nosniff" always;
# Impede que a aplicação seja carregada dentro de um iframe (clickjacking).
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
