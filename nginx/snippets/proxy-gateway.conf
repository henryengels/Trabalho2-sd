# Encaminha a requisição ao API Gateway (FastAPI) pela rede interna do Docker.
proxy_pass http://api_gateway;
proxy_http_version 1.1;
proxy_set_header Host $host;
# IP real do cliente e esquema original (https), lidos pelo uvicorn com --proxy-headers.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
proxy_read_timeout 30s;
include /etc/nginx/snippets/cabecalhos-seguranca.conf;
